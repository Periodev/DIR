<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DIR ASCII Level Editor</title>
	<style>
		:root {
			--bg: #151719;
			--panel: #202327;
			--panel-soft: #292d32;
			--line: #3a4048;
			--text: #edf0f2;
			--muted: #9ba4ad;
			--accent: #f0b84a;
			--enemy: #d95d59;
			--player: #6fc6ff;
			--polluted: #69c06f;
			--shield: #b78cff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background:
				linear-gradient(135deg, rgba(240, 184, 74, 0.09), transparent 34%),
				linear-gradient(215deg, rgba(105, 192, 111, 0.08), transparent 38%),
				var(--bg);
			color: var(--text);
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		}

		main {
			display: grid;
			grid-template-columns: minmax(280px, 420px) minmax(320px, 1fr);
			gap: 24px;
			width: min(1180px, calc(100vw - 32px));
			margin: 32px auto;
			align-items: start;
		}

		.panel {
			background: color-mix(in srgb, var(--panel) 92%, transparent);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 18px;
			box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
		}

		h1 {
			margin: 0 0 14px;
			font-size: 22px;
			font-weight: 760;
			letter-spacing: 0;
		}

		label {
			display: block;
			margin-bottom: 6px;
			color: var(--muted);
			font-size: 12px;
			text-transform: uppercase;
		}

		.controls {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 12px;
			margin-bottom: 16px;
		}

		input,
		textarea,
		button {
			font: inherit;
		}

		input {
			width: 100%;
			padding: 10px 12px;
			color: var(--text);
			background: var(--panel-soft);
			border: 1px solid var(--line);
			border-radius: 6px;
		}

		.palette {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
			margin: 8px 0 16px;
		}

		button {
			min-height: 44px;
			color: var(--text);
			background: var(--panel-soft);
			border: 1px solid var(--line);
			border-radius: 6px;
			cursor: pointer;
		}

		button:hover,
		button.active {
			border-color: var(--accent);
			background: #332b1b;
		}

		.actions {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 8px;
			margin-bottom: 16px;
		}

		.grid-wrap {
			display: grid;
			place-items: center;
			min-height: 520px;
			overflow: auto;
		}

		.grid {
			display: grid;
			gap: 8px;
			padding: 8px;
		}

		.cell {
			display: grid;
			place-items: center;
			width: clamp(48px, 8vw, 82px);
			aspect-ratio: 1;
			border: 2px solid var(--line);
			border-radius: 8px;
			background: #101214;
			color: var(--muted);
			font-size: clamp(22px, 4vw, 36px);
			font-weight: 800;
			user-select: none;
			cursor: pointer;
		}

		.cell[data-symbol="@"] {
			color: var(--player);
			border-color: color-mix(in srgb, var(--player), var(--line) 35%);
			background: rgba(111, 198, 255, 0.12);
		}

		.cell[data-symbol="E"] {
			color: var(--enemy);
			border-color: color-mix(in srgb, var(--enemy), var(--line) 35%);
			background: rgba(217, 93, 89, 0.12);
		}

		.cell[data-symbol="S"] {
			color: var(--shield);
			border-color: color-mix(in srgb, var(--shield), var(--line) 35%);
			background: rgba(183, 140, 255, 0.12);
		}

		.cell[data-symbol="P"] {
			color: var(--polluted);
			border-color: color-mix(in srgb, var(--polluted), var(--line) 35%);
			background: rgba(105, 192, 111, 0.12);
		}

		textarea {
			width: 100%;
			min-height: 170px;
			resize: vertical;
			padding: 12px;
			color: var(--text);
			background: #101214;
			border: 1px solid var(--line);
			border-radius: 6px;
			line-height: 1.45;
		}

		.status {
			min-height: 20px;
			margin-top: 8px;
			color: var(--muted);
			font-size: 12px;
		}

		@media (max-width: 820px) {
			main {
				grid-template-columns: 1fr;
				margin-block: 16px;
			}

			.grid-wrap {
				min-height: 360px;
			}
		}
	</style>
</head>
<body>
	<main>
		<section class="panel">
			<h1>DIR ASCII Level Editor</h1>

			<div class="controls">
				<div>
					<label for="widthInput">Width</label>
					<input id="widthInput" type="number" min="1" max="12" value="4">
				</div>
				<div>
					<label for="heightInput">Height</label>
					<input id="heightInput" type="number" min="1" max="12" value="4">
				</div>
			</div>

			<label>Object</label>
			<div id="palette" class="palette"></div>

			<div class="actions">
				<button id="resizeButton" type="button">Resize</button>
				<button id="clearButton" type="button">Clear</button>
			</div>

			<label for="asciiOutput">ASCII Object Map</label>
			<textarea id="asciiOutput" spellcheck="false"></textarea>
			<div id="status" class="status"></div>
		</section>

		<section class="panel grid-wrap">
			<div id="grid" class="grid" aria-label="ASCII level grid"></div>
		</section>
	</main>

	<script>
		const symbols = [
			{ value: ".", label: ". Empty" },
			{ value: "@", label: "@ Player" },
			{ value: "E", label: "E Enemy" },
			{ value: "S", label: "S Shield" },
			{ value: "P", label: "P Polluted" },
		];

		const gridEl = document.querySelector("#grid");
		const paletteEl = document.querySelector("#palette");
		const outputEl = document.querySelector("#asciiOutput");
		const statusEl = document.querySelector("#status");
		const widthInput = document.querySelector("#widthInput");
		const heightInput = document.querySelector("#heightInput");
		const resizeButton = document.querySelector("#resizeButton");
		const clearButton = document.querySelector("#clearButton");

		let width = 4;
		let height = 4;
		let activeSymbol = "E";
		let cells = [];

		function clampDimension(value) {
			const parsed = Number.parseInt(value, 10);
			if (Number.isNaN(parsed)) return 1;
			return Math.max(1, Math.min(12, parsed));
		}

		function makeEmptyCells(nextWidth, nextHeight) {
			return Array.from({ length: nextHeight }, () =>
				Array.from({ length: nextWidth }, () => ".")
			);
		}

		function buildPalette() {
			paletteEl.replaceChildren();
			for (const symbol of symbols) {
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = symbol.label;
				button.dataset.symbol = symbol.value;
				button.addEventListener("click", () => {
					activeSymbol = symbol.value;
					updatePaletteState();
				});
				paletteEl.append(button);
			}
			updatePaletteState();
		}

		function updatePaletteState() {
			for (const button of paletteEl.querySelectorAll("button")) {
				button.classList.toggle("active", button.dataset.symbol === activeSymbol);
			}
		}

		function resizeGrid(nextWidth, nextHeight) {
			const oldCells = cells;
			const oldHeight = oldCells.length;
			const oldWidth = oldHeight > 0 ? oldCells[0].length : 0;
			width = nextWidth;
			height = nextHeight;
			cells = makeEmptyCells(width, height);
			for (let y = 0; y < Math.min(height, oldHeight); y += 1) {
				for (let x = 0; x < Math.min(width, oldWidth); x += 1) {
					cells[y][x] = oldCells[y][x];
				}
			}
			renderGrid();
			updateOutput();
		}

		function placeSymbol(x, y) {
			if (activeSymbol === "@") {
				for (let row = 0; row < height; row += 1) {
					for (let col = 0; col < width; col += 1) {
						if (cells[row][col] === "@") cells[row][col] = ".";
					}
				}
			}
			cells[y][x] = activeSymbol;
			renderGrid();
			updateOutput();
		}

		function renderGrid() {
			gridEl.style.gridTemplateColumns = `repeat(${width}, minmax(0, 1fr))`;
			gridEl.replaceChildren();
			for (let y = 0; y < height; y += 1) {
				for (let x = 0; x < width; x += 1) {
					const cell = document.createElement("button");
					cell.type = "button";
					cell.className = "cell";
					cell.textContent = cells[y][x];
					cell.dataset.symbol = cells[y][x];
					cell.title = `${x}, ${y}`;
					cell.addEventListener("click", () => placeSymbol(x, y));
					gridEl.append(cell);
				}
			}
		}

		function updateOutput() {
			outputEl.value = cells.map((row) => row.join("")).join("\n");
			const playerCount = cells.flat().filter((symbol) => symbol === "@").length;
			statusEl.textContent = playerCount === 1
				? `${width}x${height}`
				: `${width}x${height} / Player count: ${playerCount}`;
		}

		function clearGrid() {
			cells = makeEmptyCells(width, height);
			renderGrid();
			updateOutput();
		}

		resizeButton.addEventListener("click", () => {
			const nextWidth = clampDimension(widthInput.value);
			const nextHeight = clampDimension(heightInput.value);
			widthInput.value = String(nextWidth);
			heightInput.value = String(nextHeight);
			resizeGrid(nextWidth, nextHeight);
		});

		clearButton.addEventListener("click", clearGrid);

		outputEl.addEventListener("input", () => {
			const rows = outputEl.value.replace(/\r/g, "").split("\n").filter((row) => row.length > 0);
			if (rows.length === 0) return;
			const nextHeight = rows.length;
			const nextWidth = rows[0].length;
			if (!rows.every((row) => row.length === nextWidth)) {
				statusEl.textContent = "ASCII rows must be rectangular.";
				return;
			}
			if (!rows.every((row) => /^[.@ESP ]+$/.test(row))) {
				statusEl.textContent = "Unsupported symbol in ASCII.";
				return;
			}
			widthInput.value = String(nextWidth);
			heightInput.value = String(nextHeight);
			width = nextWidth;
			height = nextHeight;
			cells = rows.map((row) => row.split("").map((symbol) => symbol === " " ? "." : symbol));
			renderGrid();
			updateOutput();
		});

		buildPalette();
		cells = makeEmptyCells(width, height);
		cells[height - 1][0] = "@";
		renderGrid();
		updateOutput();
	</script>
</body>
</html>
